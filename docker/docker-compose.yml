services:
  # ─────────────────────────────────────────────
  # PicoClaw Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm picoclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  picoclaw-agent:
    image: docker.io/sipeed/picoclaw:latest
    container_name: picoclaw-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.picoclaw
    entrypoint: ["picoclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # PicoClaw Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  picoclaw-gateway:
    # Remove or comment out 'image: docker.io/sipeed/picoclaw:latest'
    build:
      context: ..            # Points to the root directory where the Makefile is
      dockerfile: docker/Dockerfile  # Points to the Dockerfile here
    container_name: picoclaw-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Health server binds IPv4 127.0.0.1; container's localhost resolves to ::1 (IPv6),
    # so the image's default `localhost` healthcheck fails. Use 127.0.0.1 explicitly.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18790/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    volumes:
      - type: bind
        source: /home/ubuntu/picoclaw/docker/data
        target: /home/picoclaw/.picoclaw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - botnet

  # ─────────────────────────────────────────────
  # PicoClaw Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  picoclaw-launcher:
    image: docker.io/sipeed/picoclaw:launcher
    container_name: picoclaw-launcher
    restart: unless-stopped
    profiles:
      - launcher
    environment:
      - PICOCLAW_GATEWAY_HOST=0.0.0.0
    ports:
      - "127.0.0.1:18800:18800"
      - "127.0.0.1:18790:18790"
    volumes:
      - ./data:/root/.picoclaw

  scorer:
    build:
      context: ../../connections-score-analyzer
      dockerfile: Dockerfile
    container_name: connections-scorer
    restart: on-failure
    profiles:
      - gateway
    env_file:
      - ./data/.env
    volumes:
      - scorer-data:/data
      - ./data/solver-images:/app/solver-images
    networks:
      - botnet

networks:
  botnet:

volumes:
  scorer-data:
